name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # uv sync only searches for an interpreter under setup-uv's
      # environment; this installs the newest one matching requires-python.
      - run: uv python install
      - run: uv sync --group dev --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # uv sync only searches for an interpreter under setup-uv's
      # environment; this installs the newest one matching requires-python.
      - run: uv python install
      - run: uv sync --group dev --frozen
      - run: uv run mypy custom_components/ninebot
      # Separate pass: the scripts import pynebot directly, so checking
      # both at once would resolve the same file under two module names.
      - run: uv run mypy scripts

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # uv sync only searches for an interpreter under setup-uv's
      # environment; this installs the newest one matching requires-python.
      - run: uv python install
      - run: uv sync --group dev --frozen
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # brands: requires the domain to be registered in
          #   home-assistant/brands, which only applies to integrations
          #   submitted to Home Assistant core.
          # topics, description: repository metadata rather than anything in
          #   this tree. Drop these two from the list once they are set.
          ignore: "brands topics description"
